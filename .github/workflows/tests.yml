name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Cancel obsolete runs on new commits or force-pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# dorny/paths-filter uses the GitHub API on pull requests; checkout needs contents: read.
permissions:
  contents: read
  pull-requests: read

env:
  # Full supported Python versions across all platforms on Pull Requests
  PYTHON_VERSIONS: '["3.11", "3.12", "3.13", "3.13t", "3.14", "3.14t", "3.15", "3.15t", "pypy-3.11", "pypy-3.12"]'

  # Minimal Python baseline versions tested on push to master
  PYTHON_MASTER_LINUX: '["3.11", "pypy-3.11"]'
  PYTHON_MASTER_MACOS: '["3.11", "3.13t", "pypy-3.11"]'
  PYTHON_MASTER_WINDOWS: '["3.11"]'

jobs:
  # Inspect changed files to determine which OS and test targets need to run
  changes:
    name: 🔍 Filter Changes
    runs-on: ubuntu-latest
    if: |
      !startsWith(github.head_ref, 'all-contributors/') &&
      !startsWith(github.event.pull_request.title, 'docs:') &&
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      packaging: ${{ steps.filter.outputs.packaging == 'true' }}
      linux: ${{ steps.filter.outputs.linux == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.packaging == 'true' || steps.filter.outputs.watchmedo == 'true' }}
      examples: ${{ steps.filter.outputs.examples == 'true' }}
      macos: ${{ steps.filter.outputs.macos == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.packaging == 'true' || steps.filter.outputs.watchmedo == 'true' }}
      windows: ${{ steps.filter.outputs.windows == 'true' || steps.filter.outputs.core == 'true' || steps.filter.outputs.packaging == 'true' || steps.filter.outputs.watchmedo == 'true' }}
      freebsd: ${{ steps.filter.outputs.freebsd == 'true' }}
      core: ${{ steps.filter.outputs.core }}
      watchmedo: ${{ steps.filter.outputs.watchmedo }}
      # Run only modified tests if PR touches tests only; otherwise run full test suite
      test_args: ${{ (steps.filter.outputs.not_tests == 'false' && steps.filter.outputs.tests_files) || (steps.filter.outputs.watchmedo == 'true' && steps.filter.outputs.core == 'false' && 'tests/test_0_watchmedo.py') || (steps.filter.outputs.examples == 'true' && steps.filter.outputs.core == 'false' && 'tests/test_examples.py') || '' }}
      python: ${{ env.PYTHON_VERSIONS }}
      python_master_linux: ${{ env.PYTHON_MASTER_LINUX }}
      python_master_macos: ${{ env.PYTHON_MASTER_MACOS }}
      python_master_windows: ${{ env.PYTHON_MASTER_WINDOWS }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Path Filters
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: "some-with-excludes"
          filters: .github/filters.yml
          list-files: shell

  quality:
    name: 🧑‍🏭 Quality & Docs
    runs-on: ubuntu-latest
    if: |
      !startsWith(github.head_ref, 'all-contributors/') &&
      !contains(github.event.pull_request.title, '[skip ci]') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install tox tox-uv

      - name: Run linters
        run: python -m tox -q -e types,lint

      - name: Verify code formatting
        run: |
          if ! git diff --quiet docs/source/examples src tests; then
            echo "::error::Code requires formatting or lint fixes. Run 'tox -e lint' locally and commit the changes."
            exit 1
          fi

      - name: Build the documentation
        run: python -m tox -q -e docs

  # Verify pure wheels and source distribution packaging on Linux/Windows/Core changes
  packaging:
    name: 📦 Package Distributions
    needs: changes
    if: needs.changes.outputs.linux == 'true' || needs.changes.outputs.windows == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/dist-builder.yml
    with:
      upload_artifacts: false

  # Verify native macOS C-extension compilation on macOS/packaging changes
  macos-wheel:
    name: 🍏 Build macOS wheel
    needs: changes
    if: needs.changes.outputs.macos == 'true' || needs.changes.outputs.packaging == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/wheel-builder.yml
    with:
      archs: "arm64"
      build: ${{ github.event_name == 'pull_request' && 'cp313-*' || 'cp* pp311-* pp312-*' }}
      upload_artifacts: false

  # Linux test matrix: CPython + PyPy
  linux:
    name: 🐧 Linux
    needs: changes
    if: needs.changes.outputs.linux == 'true' || needs.changes.outputs.examples == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Minimal versions on master push; full matrix on pull requests
        python: ${{ github.event_name == 'push' && fromJSON(needs.changes.outputs.python_master_linux) || fromJSON(needs.changes.outputs.python) }}
    uses: ./.github/workflows/test-runner.yml
    with:
      runs-on: ubuntu-latest
      python: ${{ matrix.python }}
      test_args: ${{ needs.changes.outputs.test_args }}

  # macOS test matrix: CPython + free-threaded + PyPy
  macos:
    name: 🍎 macOS
    needs: changes
    if: needs.changes.outputs.macos == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Minimal versions on master push; full matrix on pull requests
        python: ${{ github.event_name == 'push' && fromJSON(needs.changes.outputs.python_master_macos) || fromJSON(needs.changes.outputs.python) }}
    uses: ./.github/workflows/test-runner.yml
    with:
      runs-on: macos-latest
      python: ${{ matrix.python }}
      test_args: ${{ needs.changes.outputs.test_args }}

  # Windows test matrix: CPython only (skips PyPy)
  windows:
    name: 🪟 Windows
    needs: changes
    if: needs.changes.outputs.windows == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Minimal version on master push; full matrix on pull requests
        python: ${{ github.event_name == 'push' && fromJSON(needs.changes.outputs.python_master_windows) || fromJSON(needs.changes.outputs.python) }}
        exclude:
          - python: "pypy-3.11"
          - python: "pypy-3.12"
    uses: ./.github/workflows/test-runner.yml
    with:
      runs-on: windows-latest
      python: ${{ matrix.python }}
      test_args: ${{ needs.changes.outputs.test_args }}

  # FreeBSD test matrix: CPython 3.11 + free-threaded 3.13t (only on kqueue changes or manual dispatch).
  # Note: tox and tox-uv are not used here because:
  #   1. Astral does not publish pre-built FreeBSD wheels for `uv` on PyPI (pip install tox-uv
  #      would attempt to compile uv from source with Rust/Cargo inside QEMU, adding 15+ mins).
  #   2. Native `pkg install` provides pre-compiled binaries in seconds without venv overhead.
  #   3. Standard tox does not natively discover FreeBSD's standalone `python3.13t` (free-threaded) interpreter.
  freebsd:
    name: FreeBSD (${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.freebsd == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard CPython baseline
          - python: "3.11"
            prepare: |
              pkg update -f
              pkg install -y python311
            run: |
              python3.11 -m ensurepip --upgrade
              python3.11 -m pip install pytest
              python3.11 -m pytest tests/test_kqueue.py -v

          # Free-threaded (no-GIL) Python 3.13
          - python: "3.13t"
            prepare: |
              pkg update -f
              pkg install -y python313t
            run: |
              # Sanity check: confirm the interpreter is genuinely running with the GIL disabled (PEP 703)
              python3.13t -c "import sys; assert not sys._is_gil_enabled(), 'GIL should be disabled'"
              python3.13t -m ensurepip --upgrade
              python3.13t -m pip install pytest
              python3.13t -m pytest tests/test_kqueue.py -v
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Uses release: "14" to automatically boot the latest minor version of the FreeBSD 14 release line,
      # which is the primary BSD target using KqueueObserver (FreeBSD 15+ has native inotify).
      - name: Run kqueue tests in FreeBSD VM (${{ matrix.python }})
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14"
          usesh: true
          prepare: ${{ matrix.prepare }}
          run: ${{ matrix.run }}
