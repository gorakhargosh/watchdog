name: Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name != 'pull_request' && github.sha || '' }}
  cancel-in-progress: true

# No job requires write access to the GITHUB_TOKEN; checkout only needs contents: read.
permissions:
  contents: read

jobs:
  quality:
    name: 🧑‍🏭 Quality & Docs
    runs-on: ubuntu-latest
    outputs:
      examples_changed: ${{ steps.detect.outputs.examples_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect example changes
        id: detect
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE_SHA" ] && git diff --name-only "$BASE_SHA" HEAD | grep -q '^docs/source/examples/'; then
            echo "examples_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "examples_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install tox tox-uv

      - name: Run linters
        run: python -m tox -q -e types,lint

      - name: Verify code formatting
        run: |
          if ! git diff --quiet docs/source/examples src tests; then
            echo "::error::Code requires formatting or lint fixes. Run 'tox -e lint' locally and commit the changes."
            exit 1
          fi

      - name: Build the documentation
        run: python -m tox -q -e docs

  tox:
    name: ${{ matrix.os.emoji }} ${{ matrix.os.name }} ${{ matrix.python }}
    runs-on: ${{ matrix.os.runs-on }}
    needs: quality
    if: "!startsWith(github.head_ref, 'all-contributors/') && (!startsWith(github.event.pull_request.title, 'docs:') || needs.quality.outputs.examples_changed == 'true')"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            matrix: linux
            emoji: 🐧
            runs-on: [ubuntu-latest]
          - name: macOS
            matrix: macos
            emoji: 🍎
            runs-on: [macos-latest]
          - name: Windows
            matrix: windows
            emoji: 🪟
            runs-on: [windows-latest]
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.13t"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
          - "pypy-3.11"
        exclude:
          - os:
              matrix: macos
            python: "pypy-3.11"
          - os:
              matrix: windows
            python: "pypy-3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
          cache: pip

      - name: Install dependencies
        run: python -m pip install tox tox-uv

      - name: Run tests
        run: python -m tox -q -e py
