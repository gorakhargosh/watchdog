name: Wheel Builder

# Reusable workflow to compile and build macOS wheels via cibuildwheel
on:
  workflow_call:
    inputs:
      archs:
        description: "Target macOS architectures (e.g. arm64, x86_64, universal2)"
        required: false
        type: string
        default: "arm64"
      build:
        description: "cibuildwheel build selector (e.g. cp313-*)"
        required: false
        type: string
        default: "cp313-*"
      ref:
        description: "The branch, tag or SHA to release from"
        required: false
        type: string
        default: ""
      upload_artifacts:
        description: "Whether to store wheels as workflow artifacts"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: 🍏 macOS (${{ inputs.archs }})
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel
        env:
          CIBW_ARCHS_MACOS: ${{ inputs.archs }}
          CIBW_BUILD: ${{ inputs.build }}
          CIBW_ENABLE: "pypy"

      - name: Artifacts list
        run: ls -l wheelhouse

      - name: Store wheels
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package-distributions-macos-${{ inputs.archs }}
          path: ./wheelhouse/*.whl
