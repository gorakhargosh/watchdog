name: Distribution Builder

# Reusable workflow to build source distribution (.tar.gz) and platform-specific pure wheels (.whl)
on:
  workflow_call:
    inputs:
      sdist:
        description: "Whether to build the source distribution"
        required: false
        type: boolean
        default: true
      pure_wheels:
        description: "Whether to build platform-specific pure wheels"
        required: false
        type: boolean
        default: true
      upload_artifacts:
        description: "Whether to store distributions as workflow artifacts"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: 📦 Package Distributions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -U setuptools wheel

      - name: Build source distribution
        if: inputs.sdist
        run: python setup.py sdist

      # Watchdog provides C-extensions for macOS, but not for other platforms.
      # To prevent pip from preferring a generic pure wheel on macOS (which would miss C-extensions),
      # we override platform names manually via --plat-name for Linux and Windows platforms.
      - name: Build pure wheels
        if: inputs.pure_wheels
        run: |
          for platform in 'manylinux_2_17_x86_64' 'manylinux_2_17_aarch64' 'manylinux_2_17_i686' 'manylinux_2_17_ppc64le' 'manylinux_2_17_s390x' 'manylinux_2_17_armv7l' 'manylinux_2_17_ppc64' 'manylinux2014_x86_64' 'manylinux2014_i686' 'manylinux2014_aarch64' 'manylinux2014_armv7l' 'manylinux2014_ppc64' 'manylinux2014_ppc64le' 'manylinux2014_s390x' 'win32' 'win_amd64' 'win_ia64' 'win_arm64'
          do
            python setup.py bdist_wheel --plat-name $platform
          done

      - name: Artifacts list
        run: ls -l dist

      - name: Store source distribution
        if: inputs.upload_artifacts && inputs.sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package-distributions-source
          path: dist/*.tar.gz

      - name: Store pure wheels
        if: inputs.upload_artifacts && inputs.pure_wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package-distributions-pure-wheels
          path: ./dist/*.whl

